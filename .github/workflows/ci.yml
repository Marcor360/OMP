name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version consistency
        run: npm run check:versions
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --runInBand

  functions:
    name: Functions · lint + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install
        run: npm ci --prefix functions
      - name: Lint
        run: npm --prefix functions run lint
      - name: Build
        run: npm --prefix functions run build
      - name: Unit tests
        run: npm --prefix functions test -- --runInBand

  rules:
    name: Firestore Rules · emulator
    runs-on: ubuntu-latest
    env:
      FIREBASE_EMULATORS_PATH: ${{ github.workspace }}/.cache/firebase/emulators
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install
        run: npm ci
      - name: Guard índices collectionGroup
        run: npm run check:indexes
      - name: Resolve firebase-tools version
        id: ft
        run: echo "version=$(node -p "require('firebase-tools/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ${{ env.FIREBASE_EMULATORS_PATH }}
          key: firestore-emulator-${{ runner.os }}-ft${{ steps.ft.outputs.version }}
      - name: Pre-download Firestore emulator
        run: npx firebase setup:emulators:firestore
      - name: Verify emulator jar present
        run: |
          ls -la "$FIREBASE_EMULATORS_PATH"
          test -f "$FIREBASE_EMULATORS_PATH"/cloud-firestore-emulator-*.jar \
            || (echo "::error::No se encontro el jar del emulador Firestore" && exit 1)
      - name: Rules tests (Firestore emulator)
        run: npm run test:rules

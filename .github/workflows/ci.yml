name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App · lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --coverage --runInBand
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Build web
        run: npm run build:web

  functions:
    name: Functions · lint + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install
        run: npm ci --prefix functions
      - name: Lint
        run: npm --prefix functions run lint
      - name: Build
        run: npm --prefix functions run build
      - name: Unit tests
        run: npm --prefix functions test -- --coverage --runInBand

  rules:
    name: Firestore Rules · emulator
    runs-on: ubuntu-latest
    env:
      FIREBASE_EMULATORS_PATH: ${{ github.workspace }}/.cache/firebase/emulators
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm ci
      - name: Guard índices collectionGroup
        run: npm run check:indexes
      - name: Verificar que firestore.rules coincide con rules_src
        run: node build-rules.js --check
      - name: Resolve firebase-tools version
        id: ft
        run: echo "version=$(node -p "require('firebase-tools/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Firestore emulator jar
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.FIREBASE_EMULATORS_PATH }}
          key: firestore-emulator-${{ runner.os }}-ft${{ steps.ft.outputs.version }}
      - name: Pre-download Firestore emulator
        run: npx firebase setup:emulators:firestore
      - name: Verify emulator jar present
        run: |
          ls -la "$FIREBASE_EMULATORS_PATH"
          test -f "$FIREBASE_EMULATORS_PATH"/cloud-firestore-emulator-*.jar \
            || (echo "::error::No se encontro el jar del emulador Firestore" && exit 1)
      - name: Rules tests (Firestore emulator)
        run: npm run test:rules
